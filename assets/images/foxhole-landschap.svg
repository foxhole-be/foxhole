<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" role="img" aria-labelledby="landschap-titel landschap-desc">
  <title id="landschap-titel">Foxhole landschap</title>
  <desc id="landschap-desc">Een zacht groen landschap met een huis, bomen, een tuin en twee mensen die samenkomen.</desc>

  <!-- zachte ondergrond -->
  <ellipse cx="400" cy="330" rx="340" ry="250" fill="#E8DDC7" opacity=".55"/>
  <circle cx="190" cy="150" r="52" fill="#E3D2B4" opacity=".6"/>

  <!-- heuvels, van licht naar donker -->
  <path d="M0 310 C120 250 250 285 370 260 C500 233 630 270 800 235 L800 640 L0 640Z" fill="#C7D2B4"/>
  <path d="M0 375 C140 320 260 355 380 330 C510 302 650 345 800 305 L800 640 L0 640Z" fill="#A8B892"/>
  <path d="M0 450 C150 390 280 435 410 410 C550 382 680 425 800 395 L800 640 L0 640Z" fill="#6E8A5F"/>
  <path d="M0 525 C160 470 300 510 430 485 C570 458 690 500 800 475 L800 640 L0 640Z" fill="#3F5B42"/>

  <!-- pad naar het huis -->
  <path d="M315 640 C350 560 425 515 495 435 C512 416 535 424 524 446 C460 525 405 580 395 640Z" fill="#E8DDC7" opacity=".85"/>

  <!-- huis -->
  <g>
    <rect x="565" y="300" width="18" height="46" rx="2" fill="#A97B52"/>
    <path d="M438 356 L520 292 L602 356Z" fill="#20362A"/>
    <rect x="455" y="352" width="130" height="84" rx="3" fill="#B2885E"/>
    <rect x="500" y="382" width="28" height="54" rx="2" fill="#8A6547"/>
    <circle cx="523" cy="408" r="2.5" fill="#E8DDC7"/>
    <rect x="470" y="372" width="24" height="24" rx="3" fill="#C7D2B4"/>
    <path d="M482 372 V396 M470 384 H494" fill="none" stroke="#20362A" stroke-width="2" opacity=".45"/>
  </g>

  <!-- bomen -->
  <g>
    <rect x="164" y="398" width="14" height="52" rx="4" fill="#8A6547"/>
    <circle cx="171" cy="372" r="40" fill="#3F5B42"/>
    <circle cx="143" cy="388" r="28" fill="#6E8A5F"/>
    <circle cx="198" cy="390" r="30" fill="#3F5B42"/>
    <circle cx="171" cy="345" r="29" fill="#6E8A5F"/>
  </g>

  <g>
    <rect x="690" y="438" width="12" height="42" rx="4" fill="#8A6547"/>
    <circle cx="696" cy="414" r="32" fill="#3F5B42"/>
    <circle cx="672" cy="427" r="23" fill="#6E8A5F"/>
    <circle cx="718" cy="426" r="24" fill="#3F5B42"/>
  </g>

  <!-- struiken bij het huis -->
  <ellipse cx="620" cy="430" rx="26" ry="14" fill="#6E8A5F"/>
  <ellipse cx="642" cy="436" rx="18" ry="11" fill="#3F5B42"/>

  <!-- mensen op het pad -->
  <g>
    <rect x="392" y="500" width="17" height="32" rx="8" fill="#C98E6A"/>
    <circle cx="400.5" cy="492" r="8" fill="#E8D8BE"/>
    <rect x="426" y="516" width="15" height="28" rx="7" fill="#B2885E"/>
    <circle cx="433.5" cy="509" r="7" fill="#E8D8BE"/>
  </g>

  <!-- gras -->
  <g fill="none" stroke="#20362A" stroke-width="3" stroke-linecap="round" opacity=".28">
    <path d="M120 545 q7 -14 14 0"/>
    <path d="M250 580 q6 -12 12 0"/>
    <path d="M560 545 q7 -14 14 0"/>
    <path d="M660 590 q6 -12 12 0"/>
    <path d="M470 600 q6 -12 12 0"/>
  </g>
</svg>
